<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 知识库</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #0a0a0f; --bg2: #111118; --surface: #16161e; --card: #1c1c28;
  --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.1);
  --text: #f1f1f3; --text2: #c4c4cc; --muted: #717182;
  --accent: #6366f1; --accent2: #8b5cf6; --accent-glow: rgba(99,102,241,0.15);
  --green: #10b981; --green-bg: rgba(16,185,129,0.1);
  --red: #ef4444; --red-bg: rgba(239,68,68,0.1);
  --amber: #f59e0b; --amber-bg: rgba(245,158,11,0.1);
  --radius: 10px; --radius-lg: 14px; --radius-xl: 18px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

/* ===== Login ===== */
.login-page {
  display: flex; align-items: center; justify-content: center; height: 100vh;
  background: radial-gradient(ellipse at 50% 30%, rgba(99,102,241,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.05) 0%, transparent 50%), var(--bg);
}
.login-card {
  width: 400px; padding: 40px 36px; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-xl); box-shadow: var(--shadow);
}
.login-card .logo-area { text-align: center; margin-bottom: 32px; }
.login-card .logo-icon {
  width: 52px; height: 52px; margin: 0 auto 16px; border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff;
}
.login-card h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
.login-card .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.login-card .field { margin-bottom: 18px; }
.login-card label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.3px; }
.login-card input {
  width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.login-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.login-card button {
  width: 100%; padding: 13px; border-radius: var(--radius); border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all 0.2s; margin-top: 4px;
}
.login-card button:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 8px 24px var(--accent-glow); }
.login-card button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.login-err { color: var(--red); font-size: 12px; text-align: center; margin-top: 14px; display: none; }

/* ===== App Shell ===== */
.app { display: none; height: 100vh; flex-direction: column; }
.app.active { display: flex; }

/* Topbar */
.topbar {
  height: 52px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg2);
  backdrop-filter: blur(12px);
}
.topbar .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.topbar .logo .dot { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.topbar .right { display: flex; align-items: center; gap: 14px; }
.topbar .right .uname { font-size: 13px; color: var(--text2); font-weight: 500; }
.badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.badge.admin { background: var(--amber-bg); color: var(--amber); }
.badge.user { background: var(--accent-glow); color: var(--accent); }
.btn-ghost {
  padding: 6px 14px; border-radius: 7px; border: 1px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 500;
  transition: all 0.15s;
}
.btn-ghost:hover { color: var(--text); border-color: var(--border2); background: rgba(255,255,255,0.03); }

/* Body */
.app-body { flex: 1; display: flex; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 260px; background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
}
.sidebar-nav { padding: 12px 10px; border-bottom: 1px solid var(--border); }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius);
  cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); transition: all 0.15s;
  margin-bottom: 2px;
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.nav-item.active { background: var(--accent-glow); color: var(--accent); }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.nav-item .badge-count { margin-left: auto; font-size: 11px; background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 8px; }

.sidebar-panel { flex: 1; overflow-y: auto; padding: 12px 10px; display: none; }
.sidebar-panel.active { display: block; }

.panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
.panel-header h4 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
.panel-actions { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.btn-sm {
  padding: 5px 12px; border-radius: 14px; border: 1px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer; font-size: 11px; font-family: inherit; font-weight: 500;
  transition: all 0.15s; white-space: nowrap;
}
.btn-sm:hover { border-color: var(--border2); color: var(--text); }
.btn-sm.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-sm.primary:hover { background: #5558e6; }
.btn-sm.danger { color: var(--red); border-color: rgba(239,68,68,0.25); }
.btn-sm.danger:hover { background: var(--red-bg); }

.search-box { position: relative; margin-bottom: 8px; }
.search-box input {
  width: 100%; padding: 8px 12px 8px 30px; background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 12px; outline: none; font-family: inherit;
}
.search-box input:focus { border-color: var(--accent); }
.search-box::before { content: '🔍'; position: absolute; left: 10px; top: 8px; font-size: 11px; opacity: 0.4; }

.entry-list { }
.entry-item {
  padding: 10px 12px; margin-bottom: 4px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid transparent; background: var(--card); transition: all 0.15s; position: relative;
}
.entry-item:hover { border-color: var(--border2); background: var(--surface); }
.entry-item .cat { font-size: 10px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.entry-item .title { font-size: 13px; font-weight: 500; }
.entry-item .preview { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-item .actions { position: absolute; right: 8px; top: 8px; display: flex; gap: 3px; opacity: 0; }
.entry-item:hover .actions { opacity: 1; }
.act-btn { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }
.act-btn:hover { color: var(--text); }
.act-btn.del:hover { color: var(--red); border-color: rgba(239,68,68,0.3); }
.empty-state { text-align: center; padding: 30px 16px; color: var(--muted); font-size: 12px; line-height: 1.8; }

/* Main Content */
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: var(--bg); }

.content-header {
  height: 48px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border);
  gap: 12px; flex-shrink: 0;
}
.content-header .ch-title { font-size: 15px; font-weight: 600; }
.content-header .ch-spacer { flex: 1; }

.model-selector { display: flex; align-items: center; gap: 8px; }
.model-selector label { font-size: 11px; color: var(--muted); font-weight: 500; }
.model-selector select {
  padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--card);
  color: var(--text); font-size: 12px; outline: none; cursor: pointer; font-family: inherit;
}
.model-selector select:focus { border-color: var(--accent); }
.status-dot {
  font-size: 11px; padding: 3px 10px; border-radius: 10px; cursor: pointer; font-weight: 500;
  transition: all 0.2s;
}
.status-dot.on { background: var(--green-bg); color: var(--green); }
.status-dot.off { background: var(--red-bg); color: var(--red); }

/* Popover */
.api-popover {
  position: absolute; top: calc(100% + 8px); right: 0; width: 300px; background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; z-index: 50;
  display: none; box-shadow: var(--shadow);
}
.api-popover.show { display: block; }
.api-popover .pf { margin-bottom: 10px; }
.api-popover .pf-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.api-popover .pf-value { font-size: 12px; color: var(--text2); background: var(--surface); padding: 6px 10px; border-radius: 6px; word-break: break-all; font-family: "SF Mono","Consolas",monospace; }
.api-popover .pf-actions { margin-top: 12px; display: flex; gap: 6px; justify-content: flex-end; }
.api-popover .pf-actions button { font-size: 11px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: inherit; }
.api-popover .pf-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Chat */
.chat-area { flex: 1; overflow-y: auto; padding: 24px 28px; }
.chat-welcome { text-align: center; padding-top: 100px; }
.chat-welcome .w-icon { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--accent2)); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
.chat-welcome h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.chat-welcome p { color: var(--muted); font-size: 13px; }
.msg { margin-bottom: 24px; animation: msgIn 0.25s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg .msg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.msg .msg-avatar { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.msg.user .msg-avatar { background: var(--accent-glow); }
.msg.assistant .msg-avatar { background: var(--green-bg); }
.msg .msg-role { font-size: 12px; font-weight: 600; }
.msg.user .msg-role { color: var(--accent); }
.msg.assistant .msg-role { color: var(--green); }
.msg .msg-tag { font-size: 10px; background: var(--amber-bg); color: var(--amber); padding: 1px 8px; border-radius: 8px; margin-left: 4px; }
.msg .msg-body { font-size: 14px; line-height: 1.8; color: var(--text2); padding-left: 38px; white-space: pre-wrap; word-break: break-word; }
.msg .msg-body.streaming::after { content: ' ▌'; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

.chat-input-wrap { padding: 14px 20px 18px; border-top: 1px solid var(--border); flex-shrink: 0; }
.chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
.chat-input-box { flex: 1; }
.chat-input-box textarea {
  width: 100%; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); color: var(--text); font-size: 14px; outline: none; resize: none;
  min-height: 48px; max-height: 120px; font-family: inherit; line-height: 1.5; transition: border-color 0.2s;
}
.chat-input-box textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.btn-send {
  width: 48px; height: 48px; border-radius: var(--radius-lg); border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
  cursor: pointer; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.btn-send:hover { opacity: 0.9; transform: scale(1.03); }
.chat-footer { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 0; }
.chat-footer .info { font-size: 11px; color: var(--muted); }
.chat-footer .info strong { color: var(--accent); font-weight: 600; }
.chat-footer .acts { display: flex; gap: 8px; }
.chat-footer .acts button { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: inherit; }
.chat-footer .acts button:hover { color: var(--text); }

/* User table panel */
.user-panel { flex: 1; overflow-y: auto; padding: 24px 28px; display: none; }
.user-panel.active { display: block; }
.user-panel .panel-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.user-panel .panel-top h3 { font-size: 18px; font-weight: 700; }
.user-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.user-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.user-table thead tr { background: var(--card); }
.user-table th { text-align: left; padding: 12px 16px; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
.user-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text2); }
.user-table tr:last-child td { border-bottom: none; }
.user-table tr:hover td { background: rgba(255,255,255,0.02); }
.user-table .role-pill { font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
.user-table .role-pill.admin { background: var(--amber-bg); color: var(--amber); }
.user-table .role-pill.user { background: var(--accent-glow); color: var(--accent); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl);
  padding: 28px 32px; width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow);
  animation: modalIn 0.2s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
.modal .field { margin-bottom: 14px; }
.modal label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
.modal input, .modal textarea {
  width: 100%; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 13px; outline: none; font-family: inherit;
}
.modal textarea { min-height: 100px; resize: vertical; }
.modal input:focus, .modal textarea:focus { border-color: var(--accent); }
.modal-actions { margin-top: 22px; display: flex; gap: 8px; justify-content: flex-end; }
.modal-actions button { padding: 9px 20px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 500; }
.modal-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.modal-actions button.danger { color: var(--red); border-color: rgba(239,68,68,0.25); }

/* Auth modal */
.auth-list { max-height: 360px; overflow-y: auto; }
.auth-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background 0.1s; }
.auth-row:hover { background: rgba(255,255,255,0.03); }
.auth-row input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
.auth-row .auth-name { flex: 1; font-size: 13px; }
.auth-row .auth-role { font-size: 11px; color: var(--muted); }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 13px; z-index: 200; animation: toastIn 0.3s ease; box-shadow: var(--shadow); font-weight: 500; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-icon">◆</div>
      <h1>AI 知识库</h1>
      <p class="sub">知识库驱动的智能问答系统</p>
    </div>
    <div class="field"><label>用户名</label><input type="text" id="loginUser" placeholder="输入用户名" autocomplete="off"></div>
    <div class="field"><label>密码</label><input type="password" id="loginPass" placeholder="输入密码"></div>
    <button id="loginBtn" onclick="handleLogin()">登 录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <div class="logo"><div class="dot"></div>AI 知识库</div>
    <div class="right">
      <span class="badge" id="roleBadge"></span>
      <span class="uname" id="displayName"></span>
      <button class="btn-ghost" onclick="openPwdModal()">修改密码</button>
      <button class="btn-ghost" onclick="doLogout()">退出</button>
    </div>
  </div>

  <div class="app-body">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-nav">
        <div class="nav-item active" data-panel="kb" onclick="switchSidePanel('kb')">
          <span class="icon">📚</span>知识库<span class="badge-count" id="kbCount">0</span>
        </div>
        <div class="nav-item" data-panel="users" id="navUsers" style="display:none;" onclick="switchSidePanel('users')">
          <span class="icon">👥</span>用户管理<span class="badge-count" id="userCountNav">0</span>
        </div>
      </div>

      <div class="sidebar-panel active" id="panel-kb">
        <div class="panel-actions">
          <button class="btn-sm primary" onclick="openAddModal()">+ 添加</button>
          <button class="btn-sm" onclick="exportCSV()">导出</button>
          <button class="btn-sm" onclick="importCSV()">导入</button>
          <button class="btn-sm danger" onclick="clearAllKB()">清空</button>
        </div>
        <div class="search-box"><input type="text" id="kbSearch" placeholder="搜索条目..." oninput="refreshKBSidebar()"></div>
        <div class="entry-list" id="kbSidebarList"></div>
      </div>

      <div class="sidebar-panel" id="panel-users">
        <div class="panel-actions">
          <button class="btn-sm primary" onclick="openCreateUserModal()">+ 创建账号</button>
        </div>
        <div class="entry-list" id="adminUserList"></div>
      </div>
    </div>

    <div class="main-content">
      <div class="content-header">
        <span class="ch-title" id="chTitle">知识库问答</span>
        <span class="ch-spacer"></span>
        <button id="btnBackChat" class="btn-sm" style="display:none;" onclick="showChatView()">← 返回问答</button>
        <div class="model-selector" id="modelSelector">
          <label>模型</label>
          <select id="chatModelSelect" onchange="onModelChange()">
            <option value="deepseek-chat">DeepSeek V3</option>
            <option value="deepseek-reasoner">DeepSeek R1</option>
            <option value="qwen-plus">通义千问 Plus</option>
            <option value="qwen-max">通义千问 Max</option>
            <option value="glm-4-flash">GLM-4 Flash</option>
            <option value="gpt-4o-mini">GPT-4o Mini</option>
          </select>
          <span class="status-dot off" id="apiStatus" onclick="toggleAPIPopover(event)" style="position:relative;">
            未配置
            <div class="api-popover" id="apiPopover">
              <div class="pf"><div class="pf-label">API 地址</div><div class="pf-value" id="popEndpoint">-</div></div>
              <div class="pf"><div class="pf-label">API Key</div><div class="pf-value" id="popKey">-</div></div>
              <div class="pf"><div class="pf-label">模型</div><div class="pf-value" id="popModel">-</div></div>
              <div class="pf-actions"><button onclick="openConfigModal();closeAPIPopover();">编辑</button><button class="primary" onclick="closeAPIPopover()">关闭</button></div>
            </div>
          </span>
        </div>
      </div>

      <div class="chat-area" id="chatArea">

function api(method, path, body) {
  var headers = { 'apikey': SUPABASE_KEY };
  if (session && session.access_token) headers['Authorization'] = 'Bearer ' + session.access_token;
  if (body) headers['Content-Type'] = 'application/json';
  var opts = { method: method, headers: headers };
  if (body) opts.body = JSON.stringify(body);
  return fetch(SUPABASE_URL + path, opts).then(function(r) {
    return r.text().then(function(t) {
      try { var d = JSON.parse(t); return { ok: r.ok, data: d, status: r.status }; }
      catch(e) { return { ok: r.ok, data: t || null, status: r.status }; }
    });
  });
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function loadKB() {

window.refreshKBSidebar = function() {
  var el = document.getElementById('kbSidebarList');

  document.getElementById('userCountNav').textContent = '';

      return Promise.all([
        api('GET', '/rest/v1/knowledge_base?select=id&user_id=eq.'+encodeURIComponent(u.id)).then(function(rr){u.kbCount=(rr.data||[]).length;}),
        api('GET', '/rest/v1/chat_history?select=id&user_id=eq.'+encodeURIComponent(u.id)).then(function(rr){u.chatCount=(rr.data||[]).length;})
      ]);
    })).then(function() {

      var list = document.getElementById('adminUserList');

          btns += '<button class="btn-sm" onclick="openAuthModal(\''+esc(u.username)+'\')">授权</button> ';

        var rolePill = '<span class="role-pill ' + u.role + '">' + (u.role==='admin'?'管理员':'用户') + '</span>';
        return { row: '<tr><td>' + esc(u.username) + '</td><td>' + rolePill + '</td><td>' + (u.kbCount||0) + '</td><td>' + (u.chatCount||0) + '</td><td>' + btns + '</td></tr>',
                 card: '<div class="entry-item"><div class="cat">'+(u.role==='admin'?'管理':'用户')+'</div><div class="title">'+esc(u.username)+'</div><div class="preview">KB '+(u.kbCount||0)+' · 对话 '+(u.chatCount||0)+'</div><div class="actions">'+btns+'</div></div>' };
      });
      if (table) table.innerHTML = html.map(function(h) { return h.row; }).join('');
      if (list) list.innerHTML = html.map(function(h) { return h.card; }).join('');

// ===== Chat =====
window.sendMessage = function() {
  if (isStreaming) { if (abortCtrl) abortCtrl.abort(); return; }
  var cfg = getCurrentConfig();
  if (!cfg.endpoint || !cfg.api_key) { toast('请先配置 API'); openConfigModal(); return; }
  var input = document.getElementById('chatInput');
  var question = input.value.trim();
  if (!question) return;
  input.value = ''; input.style.height = 'auto';
  var w = document.querySelector('.chat-welcome'); if (w) w.remove();
  appendMsg('user', question, kbCache.length);

  var messages = [];
  messages.push({ role: 'system', content: '基于知识库回答，无相关信息时回复"未找到"。' });
  if (kbCache.length > 0) {
    var kbText = kbCache.map(function(e,i) { return '条目'+(i+1)+'：\n分类：'+(e.category||'')+'\n标题：'+(e.title||'')+'\n内容：'+(e.content||''); }).join('\n\n');
    messages.push({ role: 'user', content: '【知识库】\n'+kbText+'\n\n【问题】\n'+question });
  } else { messages.push({ role: 'user', content: question }); }

  var btn = document.getElementById('btnSend'); btn.textContent = '■'; btn.style.background = '#ef4444'; isStreaming = true;
  var content = ''; var msgEl = appendMsg('assistant', '', 0, true);
  var model = document.getElementById('chatModelSelect').value;
  abortCtrl = new AbortController();

  fetch(cfg.endpoint.replace(/\/+$/,'')+'/chat/completions', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+cfg.api_key },
    body: JSON.stringify({ model: model, messages: messages, stream: true }), signal: abortCtrl.signal
  }).then(function(res) {
    if (!res.ok) return res.text().then(function(t) { throw new Error(t); });
    var reader = res.body.getReader(), decoder = new TextDecoder(), buf = '';
    function read() { reader.read().then(function(r) {
      if (r.done) { finish(); return; }
      buf += decoder.decode(r.value, { stream: true }); var lines = buf.split('\n'); buf = lines.pop()||'';
      lines.forEach(function(line) { line=line.trim(); if(!line||!line.startsWith('data: ')) return; var d=line.slice(6); if(d==='[DONE]'){finish();return;}
        try{var j=JSON.parse(d);var delta=j.choices&&j.choices[0]&&j.choices[0].delta;if(delta&&delta.content){content+=delta.content;updateStreamMsg(msgEl,content);}}catch(e){} });
      if (isStreaming) read();
    }).catch(function(){finish();}); } read();
  }).catch(function(e) { if(e.name==='AbortError'){content+='\n[已停止]';updateStreamMsg(msgEl,content);}else showMsgError(msgEl,e.message); finish(); });

  function finish() { isStreaming=false;abortCtrl=null;btn.textContent='➤';btn.style.background='';finalizeMsg(msgEl,content);
    if(content&&content.indexOf('[已停止]')===-1){var uid=session.user.id;api('POST','/rest/v1/chat_history',[{user_id:uid,role:'user',content:question},{user_id:uid,role:'assistant',content:content}]);} }
};

function appendMsg(role,text,kbCount,streaming){var c=document.getElementById('chatArea');var d=document.createElement('div');d.className='msg '+role;var n=role==='user'?'你':'AI';var b=role==='user'&&kbCount>0?'<span class="msg-tag">+'+kbCount+'条KB</span>':'';d.innerHTML='<div class="msg-head"><div class="msg-avatar">'+(role==='user'?'👤':'🤖')+'</div><span class="msg-role">'+n+'</span>'+b+'</div><div class="msg-body'+(streaming?' streaming':'')+'">'+esc(text)+'</div>';c.appendChild(d);c.scrollTop=c.scrollHeight;return d;}
function updateStreamMsg(el,text){el.querySelector('.msg-body').textContent=text;document.getElementById('chatArea').scrollTop=document.getElementById('chatArea').scrollHeight;}
function finalizeMsg(el,text){el.querySelector('.msg-body').classList.remove('streaming');el.querySelector('.msg-body').textContent=text;}
function showMsgError(el,msg){el.querySelector('.msg-body').classList.remove('streaming');el.querySelector('.msg-body').textContent='Error: '+msg;el.querySelector('.msg-body').style.color='#ef4444';}
window.clearChat=function(){api('DELETE','/rest/v1/chat_history?user_id=eq.'+encodeURIComponent(session.user.id)).then(function(){loadChatHistory();});};
function loadChatHistory(){api('GET','/rest/v1/chat_history?select=*&user_id=eq.'+encodeURIComponent(session.user.id)+'&order=created_at.asc').then(function(r){var hist=r.data||[];var c=document.getElementById('chatArea');if(hist.length===0){c.innerHTML='<div class="chat-welcome"><div class="w-icon">✦</div><h3>知识库智能问答</h3><p>在左侧录入资料后提问</p></div>';return;}c.innerHTML='';hist.forEach(function(m){appendMsg(m.role,m.content,0);});c.scrollTop=c.scrollHeight;});}
window.autoResize=function(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';};

// ===== Config =====
function loadConfig(){api('GET','/rest/v1/api_configs?select=*&user_id=eq.'+encodeURIComponent(session.user.id)).then(function(r){(r.data||[]).forEach(function(c){configCache[c.model_id]={endpoint:c.endpoint,api_key:c.api_key};});updateAPIStatus();});}
function getModelId(){return document.getElementById('chatModelSelect').value;}
function getCurrentConfig(){return configCache[getModelId()]||{};}
window.openConfigModal=function(){var mid=getModelId(),cfg=getCurrentConfig(),p=modelPresets[mid];document.getElementById('cfgModelName').textContent=p?p.name:mid;document.getElementById('cfgEndpoint').value=cfg.endpoint||(p?p.endpoint:'');document.getElementById('cfgApiKey').value=cfg.api_key||'';document.getElementById('configOverlay').classList.add('show');};
window.closeConfigModal=function(){document.getElementById('configOverlay').classList.remove('show');};
window.saveConfig=function(){var mid=getModelId();configCache[mid]={endpoint:document.getElementById('cfgEndpoint').value.trim(),api_key:document.getElementById('cfgApiKey').value.trim()};api('POST','/rest/v1/api_configs',{user_id:session.user.id,model_id:mid,endpoint:configCache[mid].endpoint,api_key:configCache[mid].api_key}).then(function(){closeConfigModal();updateAPIStatus();toast('已保存');});};
function updateAPIStatus(){var cfg=getCurrentConfig(),el=document.getElementById('apiStatus'),mid=getModelId(),p=modelPresets[mid];document.getElementById('popEndpoint').textContent=cfg.endpoint||(p?p.endpoint:'-');document.getElementById('popKey').textContent=cfg.api_key||'-';document.getElementById('popModel').textContent=p?p.name:mid;if(cfg.endpoint&&cfg.api_key){el.textContent='已配置';el.className='status-dot on';}else{el.textContent='未配置';el.className='status-dot off';}}
window.onModelChange=function(){updateAPIStatus();};
window.toggleAPIPopover=function(e){e.stopPropagation();if(document.getElementById('apiStatus').classList.contains('off')){openConfigModal();return;}var p=document.getElementById('apiPopover');if(p.classList.contains('show'))closeAPIPopover();else{updateAPIStatus();p.classList.add('show');}};
window.closeAPIPopover=function(){document.getElementById('apiPopover').classList.remove('show');};
document.addEventListener('click',function(e){if(!e.target.closest('#apiStatus')&&!e.target.closest('#apiPopover'))closeAPIPopover();});

// ===== Entry modal =====
window.openAddModal=function(){document.getElementById('modalTitle').textContent='添加知识条目';document.getElementById('modalEditId').value='';document.getElementById('modalCategory').value='';document.getElementById('modalTitleInput').value='';document.getElementById('modalContent').value='';document.getElementById('modalDeleteBtn').style.display='none';document.getElementById('modalOverlay').classList.add('show');};
window.openEditModal=function(id){var e=kbCache.find(function(x){return x.id===id;});if(!e)return;document.getElementById('modalTitle').textContent='编辑知识条目';document.getElementById('modalEditId').value=e.id;document.getElementById('modalCategory').value=e.category||'';document.getElementById('modalTitleInput').value=e.title||'';document.getElementById('modalContent').value=e.content||'';document.getElementById('modalDeleteBtn').style.display='inline-block';document.getElementById('modalOverlay').classList.add('show');};
window.closeModal=function(){document.getElementById('modalOverlay').classList.remove('show');};
window.saveEntry=function(){var id=document.getElementById('modalEditId').value;var d={category:document.getElementById('modalCategory').value.trim(),title:document.getElementById('modalTitleInput').value.trim(),content:document.getElementById('modalContent').value.trim(),user_id:session.user.id,updated_at:new Date().toISOString()};if(!d.title){toast('请输入标题');return;}if(id){api('PATCH','/rest/v1/knowledge_base?id=eq.'+encodeURIComponent(id),d).then(function(rr){if(!rr.ok)toast('保存失败');else{loadKB();closeModal();}});}else{d.id='kb_'+Date.now();d.created_at=new Date().toISOString();api('POST','/rest/v1/knowledge_base',d).then(function(rr){if(!rr.ok)toast('添加失败');else{loadKB();closeModal();}});}};
window.deleteEntry=function(){var id=document.getElementById('modalEditId').value;if(!id||!confirm('确定删除？'))return;deleteById(id);closeModal();};
window.deleteById=function(id){if(!confirm('确定删除？'))return;api('DELETE','/rest/v1/knowledge_base?id=eq.'+encodeURIComponent(id)).then(function(){loadKB();});};

window.exportCSV=function(){if(!kbCache.length){toast('知识库为空');return;}var rows=kbCache.map(function(e){return[csvEsc(e.category||''),csvEsc(e.title||''),csvEsc(e.content||'')].join(',');});var csv='category,title,content\n'+rows.join('\n');var b=new Blob(['\uFEFF'+csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kb.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);};
window.importCSV=function(){var inp=document.createElement('input');inp.type='file';inp.accept='.csv';inp.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var lines=ev.target.result.split(/\r?\n/).filter(function(l){return l.trim();});if(lines.length<2){toast('格式错误');return;}var ps=[];for(var i=1;i<lines.length;i++){var cols=parseCSV(lines[i]);if(cols.length<2)continue;ps.push(api('POST','/rest/v1/knowledge_base',{id:'kb_'+Date.now()+'_'+i,category:(cols[0]||'').trim(),title:(cols[1]||'').trim(),content:(cols[2]||'').trim(),user_id:session.user.id,created_at:new Date().toISOString(),updated_at:new Date().toISOString()}));}Promise.all(ps).then(function(){loadKB();toast('导入成功');});};r.readAsText(f,'UTF-8');};inp.click();};
function csvEsc(s){if(s.indexOf(',')!==-1||s.indexOf('"')!==-1||s.indexOf('\n')!==-1)return'"'+s.replace(/"/g,'""')+'"';return s;}
function parseCSV(l){var r=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(q){if(ch==='"'){if(i+1<l.length&&l[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else{if(ch==='"')q=true;else if(ch===','){r.push(c);c='';}else c+=ch;}}r.push(c);return r;}

document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('configOverlay').addEventListener('click',function(e){if(e.target===this)closeConfigModal();});
document.getElementById('createUserOverlay').addEventListener('click',function(e){if(e.target===this)closeCreateUserModal();});
document.getElementById('pwdOverlay').addEventListener('click',function(e){if(e.target===this)closePwdModal();});
document.getElementById('adminViewOverlay').addEventListener('click',function(e){if(e.target===this)closeAdminView();});
document.getElementById('authOverlay').addEventListener('click',function(e){if(e.target===this)closeAuthModal();});
document.getElementById('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin();});
</script>
