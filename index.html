<style>
:root {
  --bg: #09090b; --surface: #131318; --card: #1a1a24;
  --border: rgba(255,255,255,0.06); --text: #e4e4e7; --muted: #71717a;
  --accent: #6366f1; --accent2: #8b5cf6; --green: #10b981; --red: #ef4444; --amber: #f59e0b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }

#loginPage { display: flex; justify-content: center; align-items: center; height: 100vh; background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.12) 0%, transparent 60%), radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.08) 0%, transparent 60%), var(--bg); }
.login-wrap { width: 400px; }
.login-wrap .brand { text-align: center; margin-bottom: 36px; }
.login-wrap .brand .icon { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px; }
.login-wrap .brand h1 { font-size: 26px; font-weight: 700; }
.login-wrap .brand p { color: var(--muted); font-size: 14px; margin-top: 4px; }
.login-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
.login-card .field { margin-bottom: 16px; }
.login-card label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.login-card input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; outline: none; transition: all 0.2s; }
.login-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
.login-card button { width: 100%; padding: 13px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 4px; }
.login-card button:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(99,102,241,0.3); }
.login-err { color: var(--red); font-size: 12px; text-align: center; margin-top: 12px; display: none; }
.setup-hint { text-align: center; margin-top: 20px; font-size: 11px; color: #444; }
.setup-hint a { color: var(--accent); }

#mainPage { display: none; height: 100vh; flex-direction: column; }
#mainPage.show { display: flex; }
.topbar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface); }
.topbar .logo { display: flex; align-items: center; gap: 10px; }
.topbar .logo .dot { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.topbar .logo span { font-size: 16px; font-weight: 700; }
.topbar .right { display: flex; align-items: center; gap: 12px; }
.topbar .right .user { font-size: 13px; color: var(--muted); }
.role-badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; }
.role-badge.admin { background: rgba(245,158,11,0.15); color: var(--amber); }
.role-badge.user { background: rgba(99,102,241,0.15); color: var(--accent); }
.btn-ghost { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; transition: all 0.2s; }
.btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

.app-body { flex: 1; display: flex; overflow: hidden; }
.sidebar { width: 300px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.25s; overflow-y: auto; }
.sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }
.sidebar-section { padding: 0 16px 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.sidebar-section:last-child { border-bottom: none; }
.sidebar-section h4 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 0 8px; display: flex; align-items: center; justify-content: space-between; }
.sidebar-section h4 .count { font-size: 11px; color: var(--accent); }
.btn-pill { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; transition: all 0.2s; }
.btn-pill:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.btn-pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-pill.primary:hover { background: #5558e6; }
.sidebar-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.sidebar-search { position: relative; margin-top: 6px; }
.sidebar-search::before { content: '🔍'; position: absolute; left: 10px; top: 7px; font-size: 11px; opacity: 0.5; pointer-events: none; z-index: 1; }
.sidebar-search input { width: 100%; padding: 7px 10px 7px 28px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; outline: none; }
.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-list { padding: 0 4px; max-height: 300px; overflow-y: auto; }
.sidebar-list::-webkit-scrollbar { width: 3px; }
.sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
.sidebar-empty { padding: 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
.entry-card { padding: 10px 12px; margin-bottom: 6px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: all 0.15s; background: var(--card); position: relative; }
.entry-card:hover { border-color: rgba(255,255,255,0.1); }
.entry-card .ec-cat { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); margin-bottom: 3px; font-weight: 600; }
.entry-card .ec-title { font-size: 13px; font-weight: 500; color: var(--text); }
.entry-card .ec-preview { font-size: 11px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-card .ec-actions { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.entry-card:hover .ec-actions { opacity: 1; }
.ec-action { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }

.user-row .uinfo { color: var(--muted); font-size: 10px; }

.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.chat-header { display: flex; align-items: center; padding: 0 20px; height: 48px; border-bottom: 1px solid var(--border); gap: 10px; flex-shrink: 0; }
.toggle-sidebar { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.toggle-sidebar:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
.chat-header .section-title { font-size: 14px; font-weight: 600; }
.chat-header .header-spacer { flex: 1; }
.chat-header .model-area { display: flex; align-items: center; gap: 8px; position: relative; }
.chat-header .model-area label { font-size: 11px; color: var(--muted); }
.chat-header .model-area select { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 12px; outline: none; cursor: pointer; }
.chat-header .model-area select:focus { border-color: var(--accent); }
.api-status-badge { font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 500; cursor: pointer; position: relative; user-select: none; }
.api-status-badge.set { background: rgba(16,185,129,0.1); color: var(--green); }
.api-status-badge.set:hover { background: rgba(16,185,129,0.2); }
.api-status-badge.unset { background: rgba(239,68,68,0.1); color: var(--red); }
.api-status-badge.unset:hover { background: rgba(239,68,68,0.2); }
.api-popover { position: absolute; top: calc(100% + 8px); right: 0; width: 320px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; z-index: 50; display: none; box-shadow: 0 16px 48px rgba(0,0,0,0.5); }
.api-popover.show { display: block; animation: popIn 0.15s ease; }
@keyframes popIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.api-popover .pop-field { margin-bottom: 10px; }
.api-popover .pop-label { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
.api-popover .pop-value { font-size: 12px; color: var(--text); background: var(--surface); padding: 6px 10px; border-radius: 6px; word-break: break-all; font-family: monospace; }
.api-popover .pop-actions { margin-top: 12px; display: flex; gap: 6px; justify-content: flex-end; }
.api-popover .pop-actions button { font-size: 11px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
.api-popover .pop-actions button:hover { color: var(--text); }
.api-popover .pop-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.chat-messages { flex: 1; overflow-y: auto; padding: 24px 20px; background: var(--bg); }
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }
.chat-welcome { text-align: center; padding-top: 80px; }
.chat-welcome .w-icon { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--accent2)); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.chat-welcome h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.chat-welcome p { color: var(--muted); font-size: 13px; max-width: 400px; margin: 0 auto; line-height: 1.6; }
.chat-welcome .kb-stat { margin-top: 20px; font-size: 12px; color: var(--muted); }
.chat-welcome .kb-stat strong { color: var(--accent); }
.msg { margin-bottom: 20px; animation: msgIn 0.3s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.msg .msg-avatar { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.msg.user .msg-avatar { background: rgba(99,102,241,0.15); color: var(--accent); }
.msg.assistant .msg-avatar { background: rgba(16,185,129,0.15); color: var(--green); }
.msg .msg-role { font-size: 12px; font-weight: 600; }
.msg.user .msg-role { color: var(--accent); }
.msg.assistant .msg-role { color: var(--green); }
.msg .msg-kb-badge { font-size: 10px; background: rgba(245,158,11,0.15); color: var(--amber); padding: 1px 8px; border-radius: 8px; margin-left: 4px; }
.msg .msg-body { font-size: 14px; line-height: 1.75; color: #d4d4d8; padding-left: 36px; white-space: pre-wrap; word-break: break-word; }
.msg .msg-body.streaming::after { content: ' ▌'; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.chat-input-area { padding: 12px 20px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
.chat-input-wrap { flex: 1; position: relative; }
.chat-input-wrap textarea { width: 100%; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; outline: none; resize: none; min-height: 46px; max-height: 120px; font-family: inherit; line-height: 1.5; transition: border-color 0.2s; }
.chat-input-wrap textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.08); }
.btn-send { width: 46px; height: 46px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; cursor: pointer; font-size: 16px; transition: all 0.2s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.btn-send:hover { opacity: 0.9; transform: scale(1.03); }
.chat-bottom-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 2px; }
.chat-bottom-bar .kb-info { font-size: 11px; color: var(--muted); }
.chat-bottom-bar .kb-info strong { color: var(--accent); }
.chat-bottom-bar .actions { display: flex; gap: 8px; }
.chat-bottom-bar .actions button { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
.chat-bottom-bar .actions button:hover { color: var(--text); }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px; width: 500px; max-height: 80vh; overflow-y: auto; animation: modalIn 0.2s ease; }
@keyframes modalIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
.modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
.modal .field { margin-bottom: 14px; }
.modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.modal input, .modal textarea { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; font-family: inherit; }
.modal textarea { min-height: 100px; resize: vertical; }
.modal input:focus, .modal textarea:focus { border-color: var(--accent); }
.modal-actions { margin-top: 20px; display: flex; gap: 8px; justify-content: flex-end; }
.modal-actions button { padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
.modal-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.modal-actions button.danger { color: var(--red); border-color: rgba(239,68,68,0.3); }
.admin-kb-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }

.admin-kb-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text); }
.admin-log-item { font-size: 11px; padding: 4px 8px; color: var(--muted); border-bottom: 1px solid var(--border); }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 13px; z-index: 200; animation: toastIn 0.3s ease; box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

<body>

<div id="loginPage">
  <div class="login-wrap">
    <div class="brand"><div class="icon">◆</div><h1>AI知识库</h1><p>知识库驱动的多模型问答系统</p></div>
    <div class="login-card">
      <div class="field"><label>用户名</label><input type="text" id="loginUser" placeholder="输入用户名" autocomplete="off"></div>
      <div class="field"><label>密码</label><input type="password" id="loginPass" placeholder="输入密码"></div>
      <button id="loginBtn" onclick="handleLogin()">登 录</button>
      <div class="login-err" id="loginErr"></div>
    </div>
    <div class="setup-hint"></div>
  </div>
</div>

<div id="mainPage">
  <div class="topbar">
    <div class="logo"><div class="dot"></div><span>AI知识库</span></div>
    <div class="right">
      <span class="role-badge" id="roleBadge"></span>
      <span class="user" id="displayName"></span>
      <button class="btn-ghost" onclick="openPwdModal()">修改密码</button>
      <button class="btn-ghost" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="app-body">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section" id="adminSection" style="display:none">
        <h4>👥 用户管理 <span class="count" id="userCount"></span></h4>
        <div class="sidebar-actions">
          <button class="btn-pill primary" onclick="openCreateUserModal()">+ 创建账号</button>
        </div>
        <div class="sidebar-list" id="adminUserList"></div>
      </div>
      <div class="sidebar-section">
        <h4>📚 知识库 <span class="count" id="kbCount">0 条</span></h4>
        <div class="sidebar-actions">
          <button class="btn-pill primary" onclick="openAddModal()">+ 添加条目</button>
          <button class="btn-pill" onclick="exportCSV()">导出 CSV</button>
          <button class="btn-pill" onclick="importCSV()">导入</button>
        </div>
        <div class="sidebar-search"><input type="text" id="kbSearch" placeholder="搜索知识条目..." oninput="refreshKBSidebar()"></div>
        <div class="sidebar-list" id="kbSidebarList"></div>
      </div>
    </div>
    <div class="main-content">
      <div class="chat-header">
        <button class="toggle-sidebar" onclick="toggleSidebar()">☰</button>
        <span class="section-title">💬 知识库问答</span>
        <span class="header-spacer"></span>
        <div class="model-area">
          <label>模型</label>
          <select id="chatModelSelect" onchange="onModelChange()">
            <option value="deepseek-chat">DeepSeek V3</option><option value="deepseek-reasoner">DeepSeek R1</option>
            <option value="qwen-plus">通义千问 Plus</option><option value="qwen-max">通义千问 Max</option>
            <option value="glm-4-flash">智谱 GLM-4 Flash</option><option value="gpt-4o-mini">GPT-4o Mini</option>
          </select>
          <span class="api-status-badge" id="apiStatus" onclick="toggleAPIPopover(event)">未配置</span>
          <div class="api-popover" id="apiPopover">
            <div class="pop-field"><div class="pop-label">API 地址</div><div class="pop-value" id="popEndpoint">-</div></div>
            <div class="pop-field"><div class="pop-label">API Key</div><div class="pop-value" id="popKey">-</div></div>
            <div class="pop-field"><div class="pop-label">模型</div><div class="pop-value" id="popModel">-</div></div>
            <div class="pop-actions"><button onclick="openConfigModal();closeAPIPopover();">编辑</button><button class="primary" onclick="closeAPIPopover()">关闭</button></div>
          </div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-welcome"><div class="w-icon">✦</div><h3>基于知识库的智能问答</h3><p>在左侧知识库录入个人资料后提问，模型基于知识库内容精准回答。</p><div class="kb-stat" id="welcomeKbStat"></div></div>
      </div>
      <div class="chat-input-area">
        <div class="chat-input-row"><div class="chat-input-wrap"><textarea id="chatInput" placeholder="Enter 发送，Shift+Enter 换行..." rows="1" oninput="autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea></div><button class="btn-send" id="btnSend" onclick="sendMessage()">➤</button></div>
        <div class="chat-bottom-bar"><div class="kb-info">知识库条目：<strong id="kbInfoCount">0</strong> 条</div><div class="actions"><button onclick="clearChat()">清空对话</button></div></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal">
  <h3 id="modalTitle">添加知识条目</h3><input type="hidden" id="modalEditId">
  <div class="field"><label>分类</label><input type="text" id="modalCategory" placeholder="如：个人信息、工作经历"></div>
  <div class="field"><label>标题</label><input type="text" id="modalTitleInput" placeholder="条目标题"></div>
  <div class="field"><label>内容</label><textarea id="modalContent" placeholder="条目详细内容..."></textarea></div>
  <div class="modal-actions"><button id="modalDeleteBtn" class="danger" style="display:none;margin-right:auto;" onclick="deleteEntry()">删除</button><button onclick="closeModal()">取消</button><button class="primary" onclick="saveEntry()">保存</button></div>
</div></div>

<div class="modal-overlay" id="configOverlay"><div class="modal" style="width:520px;">
  <h3>⚙ API 配置 — <span id="cfgModelName" style="color:var(--accent);">-</span></h3>
  <div class="field"><label>API 地址</label><input type="text" id="cfgEndpoint" placeholder="https://api.deepseek.com/v1"></div>
  <div class="field"><label>API Key</label><input type="text" id="cfgApiKey" placeholder="sk-..."></div>
  <div style="font-size:11px;color:var(--muted);">每个模型独立配置 · <a href="https://platform.deepseek.com" target="_blank" style="color:var(--accent);">DeepSeek</a></div>
  <div class="modal-actions"><button onclick="closeConfigModal()">取消</button><button class="primary" onclick="saveConfig()">保存</button></div>
</div></div>

<div class="modal-overlay" id="createUserOverlay"><div class="modal" style="width:440px;">
  <h3>➕ 创建用户账号</h3>
  <div class="field"><label>用户名</label><input type="text" id="newUsername"></div>
  <div class="field"><label>密码</label><input type="text" id="newPassword"></div>
  <div class="modal-actions"><button onclick="closeCreateUserModal()">取消</button><button class="primary" onclick="createUser()">创建</button></div>
</div></div>

<div class="modal-overlay" id="pwdOverlay"><div class="modal" style="width:400px;">
  <h3>🔒 修改密码</h3>
  <div class="field"><label>新密码</label><input type="text" id="newPassword1"></div>
  <div class="modal-actions"><button onclick="closePwdModal()">取消</button><button class="primary" onclick="changePassword()">确认</button></div>
</div></div>

<div class="modal-overlay" id="adminViewOverlay"><div class="modal" style="width:600px;">
  <h3>📋 <span id="adminViewTitle">用户知识库</span></h3><div id="adminViewContent"></div>
  <div class="modal-actions"><button class="primary" onclick="closeAdminView()">关闭</button></div>
</div></div>

<script>
sb.init(SUPABASE_URL, SUPABASE_ANON_KEY);

var currentUser = null, currentRole = null, currentUid = null, kbCache = [], configCache = {}, isStreaming = false, abortCtrl = null;

var modelPresets = {
  'deepseek-chat': { name: 'DeepSeek V3', endpoint: 'https://api.deepseek.com/v1' },
  'deepseek-reasoner': { name: 'DeepSeek R1', endpoint: 'https://api.deepseek.com/v1' },
  'qwen-plus': { name: '通义千问 Plus', endpoint: 'https://dashscope.aliyuncs.com/compatible-mode/v1' },
  'qwen-max': { name: '通义千问 Max', endpoint: 'https://dashscope.aliyuncs.com/compatible-mode/v1' },
  'glm-4-flash': { name: '智谱 GLM-4 Flash', endpoint: 'https://open.bigmodel.cn/api/paas/v4' },
  'gpt-4o-mini': { name: 'GPT-4o Mini', endpoint: 'https://api.openai.com/v1' }
};

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function() { t.remove(); }, 2500); }
window.toggleSidebar = function() { document.getElementById('sidebar').classList.toggle('collapsed'); };

// ====== Login ======
window.handleLogin = function() {
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value.trim();
  if (!u || !p) return;
  var btn = document.getElementById('loginBtn');
  btn.textContent = '登录中...'; btn.disabled = true;
  sb.auth.signIn({ email: u + '@ai.kb', password: p }).then(function(r) {
    btn.textContent = '登 录'; btn.disabled = false;
    if (r.error) {
      var m = { 'Invalid login credentials': '用户名或密码错误', 'Email logins are disabled': '邮箱登录未启用' };
      document.getElementById('loginErr').textContent = m[r.error.message] || r.error.message;
      document.getElementById('loginErr').style.display = 'block';
      return;
    }
    currentUser = r.data.user.user_metadata.username || u;
    currentUid = r.data.user.id;
    currentRole = 'user';
    sb.from('profiles').select('role').eq('id', currentUid).single().then(function(pr) {
      if (!pr.error && pr.data) currentRole = pr.data.role;
      showMain();
    });
  });
};

function showMain() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainPage').classList.add('show');
  document.getElementById('displayName').textContent = '👤 ' + currentUser;
  var b = document.getElementById('roleBadge');
  b.textContent = currentRole === 'admin' ? '管理员' : '用户';
  b.className = 'role-badge ' + currentRole;
  document.getElementById('adminSection').style.display = currentRole === 'admin' ? 'block' : 'none';
  addLog('登录'); loadKB(); loadConfig(); loadChatHistory();
  if (currentRole === 'admin') loadAdminPanel();
}

window.doLogout = function() { addLog('登出'); sb.auth.signOut(); currentUser = null; currentUid = null; document.getElementById('mainPage').classList.remove('show'); document.getElementById('loginPage').style.display = 'flex'; };

function addLog(action) { sb.from('logs').insert({ user_id: currentUid, username: currentUser, action: action }).then(function() {}); }

// ====== KB ======
function loadKB() {
  sb.from('knowledge_base').select('*').eq('user_id', currentUid).order('updated_at', { ascending: false }).then(function(r) { kbCache = r.data || []; refreshKBSidebar(); });
}
window.refreshKBSidebar = function() {
  var el = document.getElementById('kbSidebarList');
  var q = ((document.getElementById('kbSearch')||{}).value||'').toLowerCase();
  var filtered = kbCache.filter(function(e) { if (!q) return true; return (e.category+''+e.title+''+e.content).toLowerCase().indexOf(q)!==-1; });
  el.innerHTML = filtered.length===0 ? '<div class="sidebar-empty">📭 知识库为空</div>' :
    filtered.map(function(e) {
      var pv = (e.content||'').substring(0,40);
      return '<div class="entry-card" style="position:relative;" onclick="openEditModal(\''+e.id+'\')"><div class="ec-cat">'+esc(e.category||'未分类')+'</div><div class="ec-title">'+esc(e.title||'')+'</div><div class="ec-preview">'+esc(pv)+(e.content&&e.content.length>40?'...':'')+'</div><div class="ec-actions"><button class="ec-action" onclick="event.stopPropagation();openEditModal(\''+e.id+'\')">✎</button><button class="ec-action del" onclick="event.stopPropagation();deleteById(\''+e.id+'\')">✕</button></div></div>';
    }).join('');
  document.getElementById('kbCount').textContent = kbCache.length + ' 条';
  document.getElementById('kbInfoCount').textContent = kbCache.length;
  var w = document.getElementById('welcomeKbStat'); if (w) w.innerHTML = kbCache.length>0 ? '当前知识库有 <strong>'+kbCache.length+'</strong> 条记录' : '请在左侧添加知识条目';
};

// ====== Admin ======
function loadAdminPanel() {
  sb.from('profiles').select('*').then(function(r) {
    var users = r.data || [];
    document.getElementById('userCount').textContent = users.length + ' 人';
    Promise.all(users.map(function(u) {
      return Promise.all([
        sb.from('knowledge_base').select('id').eq('user_id', u.id).then(function(rr) { u.kbCount = (rr.data||[]).length; }),
        sb.from('chat_history').select('id').eq('user_id', u.id).then(function(rr) { u.chatCount = (rr.data||[]).length; })
      ]).then(function() { return u; });
    })).then(function(usersWithCounts) {
      document.getElementById('adminUserList').innerHTML = usersWithCounts.map(function(u) {
        var btns = '<button class="btn-pill" onclick="adminViewKB(\''+u.id+'\',\''+esc(u.username)+'\')">查看</button>';
        if (u.username !== 'root') {
          btns += '<button class="btn-pill" onclick="toggleAdmin(\''+esc(u.username)+'\')">' + (u.role==='admin'?'取消管理':'设为管理') + '</button>';
          btns += '<button class="btn-pill" onclick="openGrantModal(\''+esc(u.username)+'\')">授权</button>';
          btns += '<button class="btn-pill" onclick="adminDeleteUser(\''+u.id+'\',\''+esc(u.username)+'\')" style="color:var(--red);">删除</button>';
        }
        return '<div class="user-row"><div><div class="uname">'+esc(u.username)+(u.role==='admin'?' <span style="color:var(--amber);font-size:10px;">管理员</span>':'')+'</div><div class="uinfo">知识库 '+u.kbCount+' 条 · 对话 '+u.chatCount+' 轮</div></div><div class="uacts">'+btns+'</div></div>';
      }).join('');
    });
  });
}
window.adminViewKB = function(uid, uname) {
  Promise.all([
    sb.from('knowledge_base').select('*').eq('user_id', uid),
    sb.from('logs').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(30)
  ]).then(function(r) {
    var entries = r[0].data||[], logs = r[1].data||[];
    var html = '<h4 style="color:var(--muted);margin-bottom:8px;">知识库条目 ('+entries.length+')</h4>';
    if (!entries.length) html += '<p style="color:var(--muted);">无条目</p>';
    else html += '<table class="admin-kb-table"><tr><th>分类</th><th>标题</th><th>内容</th></tr>'+entries.map(function(e){return '<tr><td>'+esc(e.category||'')+'</td><td>'+esc(e.title||'')+'</td><td>'+esc((e.content||'').substring(0,80))+'</td></tr>';}).join('')+'</table>';
    html += '<h4 style="color:var(--muted);margin-top:16px;">最近操作</h4>';
    if (!logs.length) html += '<p style="color:var(--muted);">无记录</p>';
    else html += logs.map(function(l){return '<div class="admin-log-item">'+esc(l.created_at)+' — '+esc(l.action)+'</div>';}).join('');
    document.getElementById('adminViewTitle').textContent = uname+' 的资料';
    document.getElementById('adminViewContent').innerHTML = html;
    document.getElementById('adminViewOverlay').classList.add('show');
  });
};
window.closeAdminView = function() { document.getElementById('adminViewOverlay').classList.remove('show'); };
window.toggleAdmin = function(uname) {
  sb.rpc('toggle_admin_role', { target_username: uname }).then(function(r) {
    if (r.error||r.data.error) { toast(r.data.error||'失败'); return; }
    addLog((r.data.new_role==='admin'?'设为管理':'取消管理')+': '+uname);
    loadAdminPanel(); toast(uname+' → '+(r.data.new_role==='admin'?'管理员':'普通用户'));
  });
};
window.openGrantModal = function(uname) {
  sb.from('profiles').select('username').then(function(ur) {
    var users = (ur.data||[]).map(function(p){return p.username;}).filter(function(n){return n!==uname;});
    var u2 = prompt('【'+uname+' 的知识库授权】\n输入对方用户名来授权/取消：\n可用: '+users.join(', '), '');
    if (!u2||!u2.trim()) return;
    sb.rpc('grant_kb_access', { owner_username: uname, viewer_username: u2.trim() }).then(function(rr) {
      if (rr.error||rr.data.error) { toast(rr.data.error||'失败'); return; }
      addLog((rr.data.action==='granted'?'授权':'取消授权')+': '+uname+' → '+u2.trim());
      toast(rr.data.action==='granted' ? u2.trim()+' 可查看 '+uname+' 的知识库' : '已取消');
    });
  });
};
window.adminDeleteUser = function(uid, uname) {
  if (!confirm('确定删除用户 '+uname+' 及其所有数据？')) return;
  sb.from('knowledge_base').delete().eq('user_id', uid).then(function() {
    sb.from('chat_history').delete().eq('user_id', uid).then(function() {
      sb.from('api_configs').delete().eq('user_id', uid).then(function() {
        sb.from('profiles').delete().eq('id', uid).then(function() { loadAdminPanel(); toast('已删除 '+uname); });
      });
    });
  });
};

// ====== Create user ======
window.openCreateUserModal = function() { document.getElementById('createUserOverlay').classList.add('show'); };
window.closeCreateUserModal = function() { document.getElementById('createUserOverlay').classList.remove('show'); };
window.createUser = function() {
  var uname = document.getElementById('newUsername').value.trim();
  var pwd = document.getElementById('newPassword').value.trim();
  if (!uname||!pwd) { toast('请填写用户名和密码'); return; }
  sb.rpc('create_app_user', { username: uname, password: pwd }).then(function(r) {
    if (r.error||r.data.error) { toast(r.data.error||'失败'); return; }
    closeCreateUserModal(); loadAdminPanel(); addLog('创建用户: '+uname); toast('用户 '+uname+' 已创建');
  });
};

// ====== Password ======
window.openPwdModal = function() { document.getElementById('pwdOverlay').classList.add('show'); };
window.closePwdModal = function() { document.getElementById('pwdOverlay').classList.remove('show'); };
window.changePassword = function() {
  var pwd = document.getElementById('newPassword1').value.trim();
  if (!pwd) { toast('新密码不能为空'); return; }
  sb.rpc('change_app_password', { new_password: pwd }).then(function(r) {
    if (r.error) { toast(r.error.message); return; }
    closePwdModal(); toast('密码已修改');
  });
};

// ====== Chat ======
window.sendMessage = function() {
  if (isStreaming) { if (abortCtrl) abortCtrl.abort(); return; }
  var cfg = getCurrentConfig();
  if (!cfg.endpoint || !cfg.api_key) { toast('请先配置 API'); openConfigModal(); return; }
  var input = document.getElementById('chatInput');
  var question = input.value.trim();
  if (!question) return;
  input.value = ''; input.style.height = 'auto';
  var w = document.querySelector('.chat-welcome'); if (w) w.remove();
  appendMsg('user', question, kbCache.length);
  addLog('提问: ' + question.substring(0,30));

  var messages = [];
  messages.push({ role: 'system', content: '你是知识库问答助手。请严格基于下方知识库内容回答。知识库中无相关信息时回复"知识库中未找到相关信息"。禁止编造。' });
  if (kbCache.length > 0) {
    var kbText = '【知识库内容】\n' + kbCache.map(function(e,i) { return '条目'+(i+1)+'：\n分类：'+(e.category||'')+'\n标题：'+(e.title||'')+'\n内容：'+(e.content||''); }).join('\n\n');
    messages.push({ role: 'user', content: kbText + '\n\n【用户问题】\n' + question });
  } else { messages.push({ role: 'user', content: question }); }

  var btn = document.getElementById('btnSend'); btn.textContent = '■'; btn.style.background = '#ef4444'; isStreaming = true;
  var content = ''; var msgEl = appendMsg('assistant', '', 0, true);
  var model = getModelId();
  var endpoint = cfg.endpoint.replace(/\/+$/, '') + '/chat/completions';
  abortCtrl = new AbortController();

  fetch(endpoint, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.api_key },
    body: JSON.stringify({ model: model, messages: messages, stream: true, temperature: 0.7 }), signal: abortCtrl.signal
  }).then(function(res) {
    if (!res.ok) return res.text().then(function(t) { throw new Error(t); });
    var reader = res.body.getReader(), decoder = new TextDecoder(), buf = '';
    function read() { reader.read().then(function(r) {
      if (r.done) { finish(); return; }
      buf += decoder.decode(r.value, { stream: true }); var lines = buf.split('\n'); buf = lines.pop()||'';
      lines.forEach(function(line) { line=line.trim(); if(!line||!line.startsWith('data: ')) return; var d=line.slice(6); if(d==='[DONE]'){finish();return;}
        try{var j=JSON.parse(d);var delta=j.choices&&j.choices[0]&&j.choices[0].delta;if(delta&&delta.content){content+=delta.content;updateStreamMsg(msgEl,content);}}catch(e){} });
      if (isStreaming) read();
    }).catch(function(){finish();}); } read();
  }).catch(function(e) { if(e.name==='AbortError'){content+='\n[已停止]';updateStreamMsg(msgEl,content);}else showMsgError(msgEl,e.message); finish(); });

  function finish() { isStreaming=false;abortCtrl=null;btn.textContent='➤';btn.style.background='';finalizeMsg(msgEl,content);
    if(content&&content.indexOf('[已停止]')===-1){sb.from('chat_history').insert([{user_id:currentUid,role:'user',content:question},{user_id:currentUid,role:'assistant',content:content}]).then(function(){});} }
};
function appendMsg(role,text,kbCount,streaming){var container=document.getElementById('chatMessages');var div=document.createElement('div');div.className='msg '+role;var avatar=role==='user'?'👤':'🤖',roleName=role==='user'?'你':'模型';var kbBadge=role==='user'&&kbCount>0?'<span class="msg-kb-badge">+ '+kbCount+' 条知识库</span>':'';div.innerHTML='<div class="msg-header"><div class="msg-avatar">'+avatar+'</div><span class="msg-role">'+roleName+'</span>'+kbBadge+'</div><div class="msg-body'+(streaming?' streaming':'')+'">'+esc(text)+'</div>';container.appendChild(div);container.scrollTop=container.scrollHeight;return div;}
function updateStreamMsg(el,text){el.querySelector('.msg-body').textContent=text;document.getElementById('chatMessages').scrollTop=document.getElementById('chatMessages').scrollHeight;}
function finalizeMsg(el,text){el.querySelector('.msg-body').classList.remove('streaming');el.querySelector('.msg-body').textContent=text;}
function showMsgError(el,msg){el.querySelector('.msg-body').classList.remove('streaming');el.querySelector('.msg-body').textContent='❌ '+msg;el.querySelector('.msg-body').style.color='#ef4444';}
window.clearChat=function(){sb.from('chat_history').delete().eq('user_id',currentUid).then(function(){loadChatHistory();});};
function loadChatHistory(){sb.from('chat_history').select('*').eq('user_id',currentUid).order('created_at',{ascending:true}).then(function(r){var container=document.getElementById('chatMessages');var hist=r.data||[];if(hist.length===0){container.innerHTML='<div class="chat-welcome"><div class="w-icon">✦</div><h3>基于知识库的智能问答</h3><p>在左侧知识库录入个人资料后提问。</p><div class="kb-stat" id="welcomeKbStat"></div></div>';var w=document.getElementById('welcomeKbStat');if(w)w.innerHTML=kbCache.length>0?'当前知识库有 <strong>'+kbCache.length+'</strong> 条记录':'请在左侧添加知识条目';return;}container.innerHTML='';hist.forEach(function(m){appendMsg(m.role,m.content,0);});container.scrollTop=container.scrollHeight;});}
window.autoResize=function(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';};

// ====== Config ======
function loadConfig(){sb.from('api_configs').select('*').eq('user_id',currentUid).then(function(r){(r.data||[]).forEach(function(c){configCache[c.model_id]={endpoint:c.endpoint,api_key:c.api_key};});updateAPIStatus();});}
function getModelId(){return document.getElementById('chatModelSelect').value;}
function getCurrentConfig(){return configCache[getModelId()]||{};}
window.openConfigModal=function(){var mid=getModelId(),cfg=getCurrentConfig(),preset=modelPresets[mid];document.getElementById('cfgModelName').textContent=preset?preset.name:mid;document.getElementById('cfgEndpoint').value=cfg.endpoint||(preset?preset.endpoint:'');document.getElementById('cfgApiKey').value=cfg.api_key||'';document.getElementById('configOverlay').classList.add('show');};
window.closeConfigModal=function(){document.getElementById('configOverlay').classList.remove('show');};
window.saveConfig=function(){var mid=getModelId();configCache[mid]={endpoint:document.getElementById('cfgEndpoint').value.trim(),api_key:document.getElementById('cfgApiKey').value.trim()};sb.from('api_configs').upsert({user_id:currentUid,model_id:mid,endpoint:configCache[mid].endpoint,api_key:configCache[mid].api_key},{onConflict:'user_id,model_id'}).then(function(){closeConfigModal();updateAPIStatus();toast('配置已保存');});};
function updateAPIStatus(){var cfg=getCurrentConfig(),el=document.getElementById('apiStatus'),mid=getModelId(),preset=modelPresets[mid];document.getElementById('popEndpoint').textContent=cfg.endpoint||(preset?preset.endpoint:'-');document.getElementById('popKey').textContent=cfg.api_key||'-';document.getElementById('popModel').textContent=preset?preset.name:mid;if(cfg.endpoint&&cfg.api_key){el.textContent='✓ 已配置';el.className='api-status-badge set';}else{el.textContent='✗ 未配置';el.className='api-status-badge unset';}}
window.onModelChange=function(){updateAPIStatus();};
window.toggleAPIPopover=function(e){e.stopPropagation();if(document.getElementById('apiStatus').classList.contains('unset')){openConfigModal();return;}var p=document.getElementById('apiPopover');if(p.classList.contains('show'))closeAPIPopover();else{updateAPIStatus();p.classList.add('show');}};
window.closeAPIPopover=function(){document.getElementById('apiPopover').classList.remove('show');};
document.addEventListener('click',function(e){if(!e.target.closest('#apiStatus')&&!e.target.closest('#apiPopover'))closeAPIPopover();});

// ====== Entry ======
window.openAddModal=function(){document.getElementById('modalTitle').textContent='添加知识条目';document.getElementById('modalEditId').value='';document.getElementById('modalCategory').value='';document.getElementById('modalTitleInput').value='';document.getElementById('modalContent').value='';document.getElementById('modalDeleteBtn').style.display='none';document.getElementById('modalOverlay').classList.add('show');};
window.openEditModal=function(id){var e=kbCache.find(function(x){return x.id===id;});if(!e)return;document.getElementById('modalTitle').textContent='编辑知识条目';document.getElementById('modalEditId').value=e.id;document.getElementById('modalCategory').value=e.category||'';document.getElementById('modalTitleInput').value=e.title||'';document.getElementById('modalContent').value=e.content||'';document.getElementById('modalDeleteBtn').style.display='inline-block';document.getElementById('modalOverlay').classList.add('show');};
window.closeModal=function(){document.getElementById('modalOverlay').classList.remove('show');};
window.saveEntry=function(){var id=document.getElementById('modalEditId').value;var d={category:document.getElementById('modalCategory').value.trim(),title:document.getElementById('modalTitleInput').value.trim(),content:document.getElementById('modalContent').value.trim(),user_id:currentUid,updated_at:new Date().toISOString()};if(!d.title){toast('请输入标题');return;}if(id){sb.from('knowledge_base').update(d).eq('id',id).then(function(){addLog('编辑条目');loadKB();closeModal();});}else{d.id='kb_'+Date.now();d.created_at=new Date().toISOString();sb.from('knowledge_base').insert(d).then(function(){addLog('添加条目');loadKB();closeModal();});}};
window.deleteEntry=function(){var id=document.getElementById('modalEditId').value;if(!id||!confirm('确定删除？'))return;deleteById(id);closeModal();};
window.deleteById=function(id){if(!confirm('确定删除？'))return;sb.from('knowledge_base').delete().eq('id',id).then(function(){loadKB();addLog('删除条目');});};

// ====== CSV ======
window.exportCSV=function(){if(!kbCache.length){toast('知识库为空');return;}var rows=kbCache.map(function(e){return[csvEsc(e.category||''),csvEsc(e.title||''),csvEsc(e.content||'')].join(',');});var csv='category,title,content\n'+rows.join('\n');var blob=new Blob(['\uFEFF'+csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kb.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);};
window.importCSV=function(){var inp=document.createElement('input');inp.type='file';inp.accept='.csv';inp.onchange=function(e){var f=e.target.files[0];if(!f)return;var reader=new FileReader();reader.onload=function(ev){var lines=ev.target.result.split(/\r?\n/).filter(function(l){return l.trim();});if(lines.length<2){toast('格式不正确');return;}var ps=[];for(var i=1;i<lines.length;i++){var cols=parseCSV(lines[i]);if(cols.length<2)continue;ps.push(sb.from('knowledge_base').insert({id:'kb_'+Date.now()+'_'+i,category:(cols[0]||'').trim(),title:(cols[1]||'').trim(),content:(cols[2]||'').trim(),user_id:currentUid,created_at:new Date().toISOString(),updated_at:new Date().toISOString()}));}Promise.all(ps).then(function(){loadKB();toast('导入成功');});};reader.readAsText(f,'UTF-8');};inp.click();};
function csvEsc(s){if(s.indexOf(',')!==-1||s.indexOf('"')!==-1||s.indexOf('\n')!==-1)return'"'+s.replace(/"/g,'""')+'"';return s;}
function parseCSV(l){var r=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(q){if(ch==='"'){if(i+1<l.length&&l[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else{if(ch==='"')q=true;else if(ch===','){r.push(c);c='';}else c+=ch;}}r.push(c);return r;}

document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('configOverlay').addEventListener('click',function(e){if(e.target===this)closeConfigModal();});
document.getElementById('createUserOverlay').addEventListener('click',function(e){if(e.target===this)closeCreateUserModal();});
document.getElementById('pwdOverlay').addEventListener('click',function(e){if(e.target===this)closePwdModal();});
document.getElementById('adminViewOverlay').addEventListener('click',function(e){if(e.target===this)closeAdminView();});
document.getElementById('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin();});
</script>
