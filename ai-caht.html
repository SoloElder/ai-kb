<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI知识库</title>
<style>
:root {
  --bg: #09090b; --surface: #131318; --card: #1a1a24;
  --border: rgba(255,255,255,0.06); --text: #e4e4e7; --muted: #71717a;
  --accent: #6366f1; --accent2: #8b5cf6; --green: #10b981; --red: #ef4444; --amber: #f59e0b;
  --radius: 12px; --radius-sm: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }

#mainPage { display: flex; height: 100vh; flex-direction: column; }

.topbar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface); }
.topbar .logo { display: flex; align-items: center; gap: 10px; }
.topbar .logo .dot { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.topbar .logo span { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.topbar .right { display: flex; align-items: center; gap: 12px; }
.topbar .right .user { font-size: 13px; color: var(--muted); }
.btn-ghost { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; transition: all 0.2s; }
.btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

.app-body { flex: 1; display: flex; overflow: hidden; }

.sidebar { width: 300px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.25s; }
.sidebar.collapsed { width: 0; border-right: none; overflow: hidden; }
.sidebar-header { padding: 16px 18px 12px; display: flex; align-items: center; justify-content: space-between; }
.sidebar-header h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.sidebar-header .count { font-size: 12px; color: var(--accent); background: rgba(99,102,241,0.1); padding: 2px 10px; border-radius: 10px; }
.sidebar-actions { padding: 0 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.btn-pill { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; transition: all 0.2s; }
.btn-pill:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.btn-pill.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-pill.primary:hover { background: #5558e6; }
.sidebar-search { padding: 0 16px 10px; position: relative; }
.sidebar-search::before { content: '🔍'; position: absolute; left: 28px; top: 8px; font-size: 11px; opacity: 0.5; pointer-events: none; z-index: 1; }
.sidebar-search input { width: 100%; padding: 8px 12px 8px 32px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; outline: none; }
.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
.sidebar-list::-webkit-scrollbar { width: 3px; }
.sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
.sidebar-empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
.sidebar-footer { padding: 10px 16px; border-top: 1px solid var(--border); font-size: 10px; color: #444; text-align: center; }
.sidebar-footer a { color: var(--accent); cursor: pointer; }

.entry-card { padding: 10px 12px; margin-bottom: 6px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: all 0.15s; background: var(--card); }
.entry-card:hover { border-color: rgba(255,255,255,0.1); }
.entry-card:active { transform: scale(0.99); }
.entry-card .ec-cat { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); margin-bottom: 3px; font-weight: 600; }
.entry-card .ec-title { font-size: 13px; font-weight: 500; color: var(--text); }
.entry-card .ec-preview { font-size: 11px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-card .ec-actions { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.entry-card:hover .ec-actions { opacity: 1; }
.ec-action { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }
.ec-action:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
.ec-action.del:hover { color: var(--red); border-color: rgba(239,68,68,0.3); }

.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.chat-header { display: flex; align-items: center; padding: 0 20px; height: 48px; border-bottom: 1px solid var(--border); gap: 10px; flex-shrink: 0; }
.chat-header .toggle-sidebar { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.chat-header .toggle-sidebar:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
.chat-header .section-title { font-size: 14px; font-weight: 600; }
.chat-header .header-spacer { flex: 1; }
.chat-header .model-area { display: flex; align-items: center; gap: 8px; position: relative; }
.chat-header .model-area label { font-size: 11px; color: var(--muted); }
.chat-header .model-area select { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 12px; outline: none; cursor: pointer; }
.chat-header .model-area select:focus { border-color: var(--accent); }
.api-status-badge { font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 500; transition: all 0.25s; cursor: pointer; position: relative; user-select: none; }
.api-status-badge.set { background: rgba(16,185,129,0.1); color: var(--green); }
.api-status-badge.set:hover { background: rgba(16,185,129,0.2); }
.api-status-badge.unset { background: rgba(239,68,68,0.1); color: var(--red); }
.api-status-badge.unset:hover { background: rgba(239,68,68,0.2); }

/* API popover */
.api-popover { position: absolute; top: calc(100% + 8px); right: 0; width: 320px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; z-index: 50; display: none; box-shadow: 0 16px 48px rgba(0,0,0,0.5); }
.api-popover.show { display: block; animation: popIn 0.15s ease; }
@keyframes popIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.api-popover .pop-field { margin-bottom: 10px; }
.api-popover .pop-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.api-popover .pop-value { font-size: 12px; color: var(--text); background: var(--surface); padding: 6px 10px; border-radius: 6px; word-break: break-all; font-family: "SF Mono", "Consolas", monospace; }
.api-popover .pop-value.key-value { letter-spacing: 0.5px; }
.api-popover .pop-actions { margin-top: 12px; display: flex; gap: 6px; justify-content: flex-end; }
.api-popover .pop-actions button { font-size: 11px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
.api-popover .pop-actions button:hover { color: var(--text); }
.api-popover .pop-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.chat-messages { flex: 1; overflow-y: auto; padding: 24px 20px; background: var(--bg); }
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }
.chat-welcome { text-align: center; padding-top: 80px; }
.chat-welcome .w-icon { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--accent2)); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.chat-welcome h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.chat-welcome p { color: var(--muted); font-size: 13px; max-width: 400px; margin: 0 auto; line-height: 1.6; }
.chat-welcome .kb-stat { margin-top: 20px; font-size: 12px; color: var(--muted); }
.chat-welcome .kb-stat strong { color: var(--accent); }

.msg { margin-bottom: 20px; animation: msgIn 0.3s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.msg .msg-avatar { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.msg.user .msg-avatar { background: rgba(99,102,241,0.15); color: var(--accent); }
.msg.assistant .msg-avatar { background: rgba(16,185,129,0.15); color: var(--green); }
.msg .msg-role { font-size: 12px; font-weight: 600; }
.msg.user .msg-role { color: var(--accent); }
.msg.assistant .msg-role { color: var(--green); }
.msg .msg-kb-badge { font-size: 10px; background: rgba(245,158,11,0.15); color: var(--amber); padding: 1px 8px; border-radius: 8px; margin-left: 4px; }
.msg .msg-body { font-size: 14px; line-height: 1.75; color: #d4d4d8; padding-left: 36px; white-space: pre-wrap; word-break: break-word; }
.msg .msg-body.streaming::after { content: ' ▌'; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

.chat-input-area { padding: 12px 20px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.chat-input-row { display: flex; gap: 10px; align-items: flex-end; }
.chat-input-wrap { flex: 1; position: relative; }
.chat-input-wrap textarea { width: 100%; padding: 12px 14px; padding-right: 80px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; outline: none; resize: none; min-height: 46px; max-height: 120px; font-family: inherit; line-height: 1.5; transition: border-color 0.2s; }
.chat-input-wrap textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.08); }
.chat-input-hint { position: absolute; right: 12px; bottom: 12px; font-size: 10px; color: var(--muted); pointer-events: none; }
.btn-send { width: 46px; height: 46px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; cursor: pointer; font-size: 16px; transition: all 0.2s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.btn-send:hover { opacity: 0.9; transform: scale(1.03); }
.btn-send:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.chat-bottom-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 2px; }
.chat-bottom-bar .kb-info { font-size: 11px; color: var(--muted); }
.chat-bottom-bar .kb-info strong { color: var(--accent); }
.chat-bottom-bar .actions { display: flex; gap: 8px; }
.chat-bottom-bar .actions button { font-size: 11px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
.chat-bottom-bar .actions button:hover { color: var(--text); }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px; width: 500px; max-height: 80vh; overflow-y: auto; animation: modalIn 0.2s ease; }
@keyframes modalIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
.modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
.modal .field { margin-bottom: 14px; }
.modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.modal input, .modal textarea { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; font-family: inherit; }
.modal textarea { min-height: 100px; resize: vertical; }
.modal input:focus, .modal textarea:focus { border-color: var(--accent); }
.modal-actions { margin-top: 20px; display: flex; gap: 8px; justify-content: flex-end; }
.modal-actions button { padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
.modal-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.modal-actions button.danger { color: var(--red); border-color: rgba(239,68,68,0.3); }

.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 13px; z-index: 200; animation: toastIn 0.3s ease; box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.toast.success { border-color: rgba(16,185,129,0.3); }
</style>
</head>
<body>

<div id="mainPage" class="show">
  <div class="topbar">
    <div class="logo"><div class="dot"></div><span>AI知识库</span></div>
    <div class="right">
      <span class="user">AI知识库</span>
    </div>
  </div>

  <div class="app-body">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>📚 知识库</h3>
        <span class="count" id="kbCount">0 条</span>
      </div>
      <div class="sidebar-actions">
        <button class="btn-pill primary" onclick="openAddModal()">+ 添加条目</button>
        <button class="btn-pill" onclick="exportCSV()">导出 CSV</button>
        <button class="btn-pill" onclick="importCSV()">导入</button>
      </div>
      <div class="sidebar-search"><input type="text" id="kbSearch" placeholder="搜索知识条目..." oninput="refreshKBSidebar()"></div>
      <div class="sidebar-list" id="kbSidebarList"></div>
      <div class="sidebar-footer">
        数据存储在浏览器本地 · <a onclick="exportCSV()">导出为 CSV 文件</a> 备份
      </div>
    </div>

    <div class="main-content">
      <div class="chat-header">
        <button class="toggle-sidebar" onclick="toggleSidebar()" title="收起/展开知识库">☰</button>
        <span class="section-title">💬 知识库问答</span>
        <span class="header-spacer"></span>
        <div class="model-area">
          <label>模型</label>
          <select id="chatModelSelect" onchange="onModelChange()">
            <option value="deepseek-chat">DeepSeek V3</option>
            <option value="deepseek-reasoner">DeepSeek R1</option>
            <option value="qwen-plus">通义千问 Plus</option>
            <option value="qwen-max">通义千问 Max</option>
            <option value="glm-4-flash">智谱 GLM-4 Flash</option>
            <option value="gpt-4o-mini">GPT-4o Mini</option>
          </select>
          <span class="api-status-badge" id="apiStatus" onclick="toggleAPIPopover(event)">未配置</span>
          <div class="api-popover" id="apiPopover">
            <div class="pop-field"><div class="pop-label">API 地址</div><div class="pop-value" id="popEndpoint">-</div></div>
            <div class="pop-field"><div class="pop-label">API Key</div><div class="pop-value key-value" id="popKey">-</div></div>
            <div class="pop-field"><div class="pop-label">模型</div><div class="pop-value" id="popModel">-</div></div>
            <div class="pop-actions"><button onclick="openConfigModal();closeAPIPopover();">编辑</button><button class="primary" onclick="closeAPIPopover()">关闭</button></div>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="chat-welcome">
          <div class="w-icon">✦</div>
          <h3>基于知识库的智能问答</h3>
          <p>在左侧知识库录入个人资料后提问，模型基于知识库内容精准回答。</p>
          <div class="kb-stat" id="welcomeKbStat"></div>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="chat-input-row">
          <div class="chat-input-wrap">
            <textarea id="chatInput" placeholder="输入问题，Enter 发送，Shift+Enter 换行..." rows="1" oninput="autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
            <span class="chat-input-hint" id="kbHint"></span>
          </div>
          <button class="btn-send" id="btnSend" onclick="sendMessage()">➤</button>
        </div>
        <div class="chat-bottom-bar">
          <div class="kb-info">知识库条目：<strong id="kbInfoCount">0</strong> 条，每次提问自动附带全部</div>
          <div class="actions"><button onclick="clearChat()">清空对话</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 条目编辑弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">添加知识条目</h3>
    <input type="hidden" id="modalEditId">
    <div class="field"><label>分类</label><input type="text" id="modalCategory" placeholder="如：个人信息、工作经历、项目文档"></div>
    <div class="field"><label>标题</label><input type="text" id="modalTitleInput" placeholder="条目标题"></div>
    <div class="field"><label>内容</label><textarea id="modalContent" placeholder="条目详细内容..."></textarea></div>
    <div class="modal-actions">
      <button id="modalDeleteBtn" class="danger" style="display:none;margin-right:auto;" onclick="deleteEntry()">删除</button>
      <button onclick="closeModal()">取消</button>
      <button class="primary" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<!-- API 配置弹窗 -->
<div class="modal-overlay" id="configOverlay">
  <div class="modal" style="width:520px;">
    <h3>⚙ API 配置 — <span id="cfgModelName" style="color:var(--accent);">-</span></h3>
    <div class="field"><label>API 地址（Base URL）</label><input type="text" id="cfgEndpoint" placeholder="https://api.deepseek.com/v1"></div>
    <div class="field"><label>API Key</label><input type="text" id="cfgApiKey" placeholder="sk-..."></div>
    <div style="font-size:11px;color:var(--muted);margin-top:4px;">
      每个模型独立配置，互不影响。推荐 <a href="https://platform.deepseek.com" target="_blank" style="color:var(--accent);">DeepSeek</a> · <a href="https://bailian.console.aliyun.com" target="_blank" style="color:var(--accent);">通义千问</a>
    </div>
    <div class="modal-actions">
      <button onclick="closeConfigModal()">取消</button>
      <button class="primary" onclick="saveConfig()">保存配置</button>
    </div>
  </div>
</div>

<script>
(function() {
  var KB_KEY = 'ai_chat_kb';
  var CFG_KEY = 'ai_chat_model_configs';

  var modelPresets = {
    'deepseek-chat':    { name: 'DeepSeek V3',        endpoint: 'https://api.deepseek.com/v1' },
    'deepseek-reasoner':{ name: 'DeepSeek R1',        endpoint: 'https://api.deepseek.com/v1' },
    'qwen-plus':        { name: '通义千问 Plus',      endpoint: 'https://dashscope.aliyuncs.com/compatible-mode/v1' },
    'qwen-max':         { name: '通义千问 Max',       endpoint: 'https://dashscope.aliyuncs.com/compatible-mode/v1' },
    'glm-4-flash':      { name: '智谱 GLM-4 Flash',  endpoint: 'https://open.bigmodel.cn/api/paas/v4' },
    'gpt-4o-mini':      { name: 'GPT-4o Mini',        endpoint: 'https://api.openai.com/v1' }
  };
  var CHAT_KEY = 'ai_chat_history';

  var isStreaming = false;
  var abortCtrl = null;

  // ====== Init ======
  function init() {
    refreshKBSidebar();
    refreshKBStats();
    renderChatHistory();
    updateAPIStatus();
  }

  // ====== Sidebar ======
  window.toggleSidebar = function() { document.getElementById('sidebar').classList.toggle('collapsed'); };

  // ====== KB Data ======
  function getKB() { try { return JSON.parse(localStorage.getItem(KB_KEY) || '[]'); } catch(e) { return []; } }
  function saveKB(entries) {
    localStorage.setItem(KB_KEY, JSON.stringify(entries));
    document.getElementById('kbCount').textContent = entries.length + ' 条';
    refreshKBStats();
  }

  window.refreshKBSidebar = function() {
    var el = document.getElementById('kbSidebarList');
    var entries = getKB();
    var q = ((document.getElementById('kbSearch') || {}).value || '').toLowerCase();
    var filtered = entries.filter(function(e) {
      if (!q) return true;
      return (e.category+''+e.title+''+e.content).toLowerCase().indexOf(q) !== -1;
    });
    el.innerHTML = filtered.length === 0
      ? '<div class="sidebar-empty">📭 知识库为空<br><span style="font-size:12px;">点击「+ 添加条目」开始录入</span></div>'
      : filtered.map(function(e) {
          var preview = (e.content || '').substring(0, 40);
          return '<div class="entry-card" style="position:relative;" onclick="openEditModal(\'' + e.id + '\')">' +
            '<div class="ec-cat">' + esc(e.category || '未分类') + '</div>' +
            '<div class="ec-title">' + esc(e.title || '无标题') + '</div>' +
            '<div class="ec-preview">' + esc(preview) + (e.content && e.content.length > 40 ? '...' : '') + '</div>' +
            '<div class="ec-actions">' +
              '<button class="ec-action" onclick="event.stopPropagation();openEditModal(\'' + e.id + '\')" title="编辑">✎</button>' +
              '<button class="ec-action del" onclick="event.stopPropagation();deleteById(\'' + e.id + '\')" title="删除">✕</button>' +
            '</div></div>';
        }).join('');
    document.getElementById('kbCount').textContent = entries.length + ' 条';
  };

  function refreshKBStats() {
    var entries = getKB();
    document.getElementById('kbInfoCount').textContent = entries.length;
    document.getElementById('kbHint').textContent = entries.length > 0 ? '附带 ' + entries.length + ' 条知识库' : '';
    var w = document.getElementById('welcomeKbStat');
    if (w) w.innerHTML = entries.length > 0
      ? '当前知识库有 <strong>' + entries.length + '</strong> 条记录，可直接提问'
      : '请先在左侧添加知识条目';
  }

  // ====== Chat ======
  window.sendMessage = function() {
    if (isStreaming) { if (abortCtrl) abortCtrl.abort(); return; }

    var cfg = getConfig();
    if (!cfg.endpoint || !cfg.apiKey) { toast('请先配置 API'); openConfigModal(); return; }

    var input = document.getElementById('chatInput');
    var question = input.value.trim();
    if (!question) return;
    input.value = ''; input.style.height = 'auto';
    document.getElementById('kbHint').textContent = '';

    var entries = getKB();
    var welcome = document.querySelector('.chat-welcome');
    if (welcome) welcome.remove();

    appendMsg('user', question, entries.length);

    var messages = [];
    messages.push({ role: 'system', content: '你是知识库问答助手。请严格基于下方知识库内容回答。知识库中无相关信息时回复"知识库中未找到相关信息"。禁止编造。' });
    if (entries.length > 0) {
      var kbText = '【知识库内容】\n' + entries.map(function(e, i) {
        return '条目'+(i+1)+'：\n分类：'+(e.category||'')+'\n标题：'+(e.title||'')+'\n内容：'+(e.content||'');
      }).join('\n\n');
      messages.push({ role: 'user', content: kbText + '\n\n【用户问题】\n' + question });
    } else {
      messages.push({ role: 'user', content: question });
    }

    var hist = getChatHistory();
    for (var i = Math.max(0, hist.length - 6); i < hist.length; i++) messages.push(hist[i]);

    var btn = document.getElementById('btnSend');
    btn.textContent = '■'; btn.style.background = '#ef4444';
    isStreaming = true;

    var content = '';
    var msgEl = appendMsg('assistant', '', 0, true);

    var model = getModelId();
    var endpoint = cfg.endpoint.replace(/\/+$/, '') + '/chat/completions';
    abortCtrl = new AbortController();

    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model: model, messages: messages, stream: true, temperature: 0.7 }),
      signal: abortCtrl.signal
    }).then(function(res) {
      if (!res.ok) return res.text().then(function(t) { throw new Error(t); });
      var reader = res.body.getReader(), decoder = new TextDecoder(), buf = '';
      function read() {
        reader.read().then(function(r) {
          if (r.done) { finish(); return; }
          buf += decoder.decode(r.value, { stream: true });
          var lines = buf.split('\n'); buf = lines.pop() || '';
          lines.forEach(function(line) {
            line = line.trim();
            if (!line || !line.startsWith('data: ')) return;
            var d = line.slice(6);
            if (d === '[DONE]') { finish(); return; }
            try { var j = JSON.parse(d); var delta = j.choices && j.choices[0] && j.choices[0].delta; if (delta && delta.content) { content += delta.content; updateStreamMsg(msgEl, content); } } catch(e) {}
          });
          if (isStreaming) read();
        }).catch(function() { finish(); });
      }
      read();
    }).catch(function(e) {
      if (e.name === 'AbortError') { content += '\n[已停止]'; updateStreamMsg(msgEl, content); }
      else showMsgError(msgEl, e.message);
      finish();
    });

    function finish() {
      isStreaming = false; abortCtrl = null;
      btn.textContent = '➤'; btn.style.background = '';
      finalizeMsg(msgEl, content);
      if (content && content.indexOf('[已停止]') === -1) {
        var h = getChatHistory();
        h.push({ role: 'user', content: question });
        h.push({ role: 'assistant', content: content });
        if (h.length > 50) h = h.slice(-50);
        saveChatHistory(h);
      }
    }
  };

  function appendMsg(role, text, kbCount, streaming) {
    var container = document.getElementById('chatMessages');
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var avatar = role === 'user' ? '👤' : '🤖';
    var roleName = role === 'user' ? '你' : '模型';
    var kbBadge = role === 'user' && kbCount > 0 ? '<span class="msg-kb-badge">+ ' + kbCount + ' 条知识库</span>' : '';
    div.innerHTML = '<div class="msg-header"><div class="msg-avatar">' + avatar + '</div><span class="msg-role">' + roleName + '</span>' + kbBadge +
      '</div><div class="msg-body' + (streaming ? ' streaming' : '') + '">' + esc(text) + '</div>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
  }
  function updateStreamMsg(el, text) { var b = el.querySelector('.msg-body'); if (b) b.textContent = text; document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight; }
  function finalizeMsg(el, text) { var b = el.querySelector('.msg-body'); if (b) { b.classList.remove('streaming'); b.textContent = text; } }
  function showMsgError(el, msg) { var b = el.querySelector('.msg-body'); if (b) { b.classList.remove('streaming'); b.textContent = '❌ 错误: ' + msg; b.style.color = '#ef4444'; } }

  window.clearChat = function() {
    saveChatHistory([]);
    document.getElementById('chatMessages').innerHTML = '<div class="chat-welcome"><div class="w-icon">✦</div><h3>基于知识库的智能问答</h3><p>在左侧知识库录入个人资料后提问，模型基于知识库内容精准回答。</p><div class="kb-stat" id="welcomeKbStat"></div></div>';
    refreshKBStats();
  };
  function renderChatHistory() {
    var container = document.getElementById('chatMessages');
    var hist = getChatHistory();
    if (hist.length === 0) {
      container.innerHTML = '<div class="chat-welcome"><div class="w-icon">✦</div><h3>基于知识库的智能问答</h3><p>在左侧知识库录入个人资料后提问，模型基于知识库内容精准回答。</p><div class="kb-stat" id="welcomeKbStat"></div></div>';
      refreshKBStats(); return;
    }
    container.innerHTML = '';
    hist.forEach(function(m) { appendMsg(m.role, m.content, 0); });
    container.scrollTop = container.scrollHeight;
  }
  function getChatHistory() { try { return JSON.parse(localStorage.getItem(CHAT_KEY) || '[]'); } catch(e) { return []; } }
  function saveChatHistory(h) { localStorage.setItem(CHAT_KEY, JSON.stringify(h)); }
  window.autoResize = function(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; };

  // ====== Config (per-model) ======
  function getModelId() { return document.getElementById('chatModelSelect').value; }
  function getAllConfigs() { try { return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); } catch(e) { return {}; } }
  function getConfig(modelId) {
    var all = getAllConfigs();
    return all[modelId || getModelId()] || {};
  }

  window.openConfigModal = function() {
    var mid = getModelId();
    var cfg = getConfig();
    var preset = modelPresets[mid];
    document.getElementById('cfgModelName').textContent = preset ? preset.name : mid;
    document.getElementById('cfgEndpoint').value = cfg.endpoint || (preset ? preset.endpoint : '');
    document.getElementById('cfgApiKey').value = cfg.apiKey || '';
    document.getElementById('configOverlay').classList.add('show');
  };
  window.closeConfigModal = function() { document.getElementById('configOverlay').classList.remove('show'); };
  window.saveConfig = function() {
    var mid = getModelId();
    var all = getAllConfigs();
    all[mid] = { endpoint: document.getElementById('cfgEndpoint').value.trim(), apiKey: document.getElementById('cfgApiKey').value.trim() };
    localStorage.setItem(CFG_KEY, JSON.stringify(all));
    closeConfigModal();
    updateAPIStatus();
    toast(mid + ' 配置已保存');
  };
  function updateAPIStatus() {
    var cfg = getConfig();
    var el = document.getElementById('apiStatus');
    var popEndpoint = document.getElementById('popEndpoint');
    var popKey = document.getElementById('popKey');
    var popModel = document.getElementById('popModel');
    var mid = getModelId();
    var preset = modelPresets[mid];

    if (cfg.endpoint && cfg.apiKey) {
      el.textContent = '✓ 已配置'; el.className = 'api-status-badge set';
      if (popEndpoint) popEndpoint.textContent = cfg.endpoint;
      if (popKey) popKey.textContent = cfg.apiKey;
      if (popModel) popModel.textContent = preset ? preset.name : mid;
    } else {
      el.textContent = '✗ 未配置'; el.className = 'api-status-badge unset';
      if (popEndpoint) popEndpoint.textContent = preset ? preset.endpoint : '-';
      if (popKey) popKey.textContent = '-';
      if (popModel) popModel.textContent = preset ? preset.name : mid;
    }
  }

  // Model select change
  window.onModelChange = function() { updateAPIStatus(); };

  // ====== API Popover ======
  window.toggleAPIPopover = function(e) {
    e.stopPropagation();
    var badge = document.getElementById('apiStatus');
    if (badge.classList.contains('unset')) { openConfigModal(); return; }
    var pop = document.getElementById('apiPopover');
    if (pop.classList.contains('show')) { closeAPIPopover(); } else { updateAPIStatus(); pop.classList.add('show'); }
  };
  window.closeAPIPopover = function() { var p = document.getElementById('apiPopover'); if (p) p.classList.remove('show'); };
  document.addEventListener('click', function(e) { if (!e.target.closest('#apiStatus') && !e.target.closest('#apiPopover')) closeAPIPopover(); });

  // ====== Entry modal ======
  window.openAddModal = function() {
    document.getElementById('modalTitle').textContent = '添加知识条目';
    document.getElementById('modalEditId').value = '';
    document.getElementById('modalCategory').value = '';
    document.getElementById('modalTitleInput').value = '';
    document.getElementById('modalContent').value = '';
    document.getElementById('modalDeleteBtn').style.display = 'none';
    document.getElementById('modalOverlay').classList.add('show');
  };
  window.openEditModal = function(id) {
    var e = getKB().find(function(x) { return x.id === id; }); if (!e) return;
    document.getElementById('modalTitle').textContent = '编辑知识条目';
    document.getElementById('modalEditId').value = e.id;
    document.getElementById('modalCategory').value = e.category || '';
    document.getElementById('modalTitleInput').value = e.title || '';
    document.getElementById('modalContent').value = e.content || '';
    document.getElementById('modalDeleteBtn').style.display = 'inline-block';
    document.getElementById('modalOverlay').classList.add('show');
  };
  window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('show'); };
  window.saveEntry = function() {
    var id = document.getElementById('modalEditId').value;
    var entries = getKB();
    var data = { id: id || 'kb_' + Date.now(), category: document.getElementById('modalCategory').value.trim(), title: document.getElementById('modalTitleInput').value.trim(), content: document.getElementById('modalContent').value.trim(), ts: Date.now() };
    if (!data.title) { toast('请输入标题'); return; }
    if (id) { var idx = entries.findIndex(function(e) { return e.id === id; }); if (idx !== -1) { data.created = entries[idx].created; entries[idx] = data; } }
    else { data.created = Date.now(); entries.push(data); }
    saveKB(entries); closeModal(); refreshKBSidebar();
  };
  window.deleteEntry = function() {
    var id = document.getElementById('modalEditId').value; if (!id) return;
    if (!confirm('确定删除？')) return; deleteById(id); closeModal();
  };
  window.deleteById = function(id) {
    if (!confirm('确定删除？')) return;
    saveKB(getKB().filter(function(e) { return e.id !== id; })); refreshKBSidebar();
  };

  // ====== CSV ======
  window.exportCSV = function() {
    var entries = getKB(); if (!entries.length) { toast('知识库为空'); return; }
    var rows = entries.map(function(e) { return [csvEsc(e.category||''), csvEsc(e.title||''), csvEsc(e.content||'')].join(','); });
    var csv = 'category,title,content\n' + rows.join('\n');
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'knowledge_base.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); toast('CSV 已下载到浏览器下载目录');
  };
  window.importCSV = function() {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv';
    inp.onchange = function(e) {
      var f = e.target.files[0]; if (!f) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var lines = ev.target.result.split(/\r?\n/).filter(function(l) { return l.trim(); });
        if (lines.length < 2) { toast('CSV 格式不正确'); return; }
        var entries = getKB();
        for (var i = 1; i < lines.length; i++) {
          var cols = parseCSV(lines[i]); if (cols.length < 2) continue;
          entries.push({ id: 'kb_' + Date.now() + '_' + i, category: (cols[0]||'').trim(), title: (cols[1]||'').trim(), content: (cols[2]||'').trim(), created: Date.now(), ts: Date.now() });
        }
        saveKB(entries); refreshKBSidebar(); toast('导入成功');
      };
      reader.readAsText(f, 'UTF-8');
    };
    inp.click();
  };
  function csvEsc(s) { if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) return '"' + s.replace(/"/g, '""') + '"'; return s; }
  function parseCSV(line) { var r = [], c = '', q = false; for (var i = 0; i < line.length; i++) { var ch = line[i]; if (q) { if (ch === '"') { if (i + 1 < line.length && line[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; } else { if (ch === '"') q = true; else if (ch === ',') { r.push(c); c = ''; } else c += ch; } } r.push(c); return r; }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast success'; t.textContent = msg; document.body.appendChild(t); setTimeout(function() { t.remove(); }, 2500); }

  document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  document.getElementById('configOverlay').addEventListener('click', function(e) { if (e.target === this) closeConfigModal(); });

  init();
})();
</script>
</body>
